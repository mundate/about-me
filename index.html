<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dawson Munday | Software Engineer</title>
    <meta
      name="description"
      content="Dawson Munday is a software engineer in Des Moines, IA, with experience across web apps, identity and authentication, CI/CD, and embedded systems."
    />
    <link rel="canonical" href="https://dmunday.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dmunday.com/" />
    <meta property="og:title" content="Dawson Munday | Software Engineer" />
    <meta
      property="og:description"
      content="Software engineer in Des Moines, IA, with experience across web apps, identity and authentication, CI/CD, and embedded systems."
    />
    <script>
      // Set the theme before first paint so there's no flash; ThemeProvider takes over once React loads
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('theme') ??
          (matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light')
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
