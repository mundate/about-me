# Never cache asset errors; a 404 during a deploy must not stick in the browser
map $status $assets_cache_control {
  ~^[45]  "no-store";
  default "public, max-age=31536000, immutable";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Always revalidate so new deploys are picked up immediately
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Hashed filenames change on every build, so these can be cached forever
  location /assets/ {
    add_header Cache-Control $assets_cache_control always;
  }
}
